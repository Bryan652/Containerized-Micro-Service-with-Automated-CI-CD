services: 
  web:
    build: . # use dockerfile. You can nest this btw like build: ./path/to/dockerfile
    image: book-api
    container_name: book-api-container
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - DB_HOST=db # <- name is based on the service name
    depends_on:
      db: 
        condition: service_healthy

  db: # This has no build . so it won't use dockerfile
    image: postgres:15
    container_name: book-db-container
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
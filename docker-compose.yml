services: 
  web:
    build: . # use dockerfile. You can nest this btw like build: ./path/to/dockerfile
    image: book-api
    container_name: book-api-container
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - DB_HOST=db # <- name is based on the service name
    depends_on:
      - db

  db: # This has no build . so it won't use dockerfile
    image: postgres:15
    container_name: book-db-container
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
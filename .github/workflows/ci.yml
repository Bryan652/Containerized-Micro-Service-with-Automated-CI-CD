name: CI Pipeline

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cp .env.example .env

      - name: Buid and Start Containers
        run: |
          docker compose up --build -d

      - name: Check Container Status
        run: |
          docker ps
          # Verification Both the web and db containers are healthy "Up" status in logs

      - name: Run Linter (Ruff)
        continue-on-error: false
        run: |
          docker compose run --rm web ruff check .
          # Verification: Ruff scans python files and exits with code 0 if no lint errors are found

      - name: Run Unit Tests
        run: |
          docker compose run --rm web env PYTHONPATH=. pytest
          # Verification Test done and returns green

      - name: Tear Down Containers
        if: Always()
        run: |
          docker compose down -v

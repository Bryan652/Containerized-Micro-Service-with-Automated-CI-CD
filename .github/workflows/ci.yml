name: CI Pipeline

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Dummy .env for CI
        run: |
          echo "POSTGRES_USER=postgres" >> .env
          echo "POSTGRES_PASSWORD=testpassword" >> .env
          echo "POSTGRES_DB=containerized_db" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_HOST=db" >> .env
          echo "DB_USER=postgres" >> .env
          echo "DB_PASSWORD=testpassword" >> .env
          echo "DB_NAME=containerized_db" >> .env

      - name: Buid and Start Containers
        run: |
          docker compose up --build -d

      - name: Check Container Status
        run: |
          docker ps
          # Verification Both the web and db containers are healthy "Up" status in logs

      - name: Run Unit Tests
        run: |
          docker compose run --rm web env PYTHONPATH=. pytest
          # Verification Test done and returns green

      - name: Tear Down Containers
        if: Always()
        run: |
          docker compose down -v
